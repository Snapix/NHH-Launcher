name: Build NHH Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Ensure Winlator runtime source is present
        run: |
          set -euo pipefail
          WINLATOR_SHA="f8a211ce7fd776de9a2642b45d166016876eaa86"
          if [ ! -f winlator-app/app/build.gradle ]; then
            rm -rf winlator-app
            git clone --no-tags --depth 1 https://github.com/brunodev85/winlator-app.git winlator-app
          fi
          cd winlator-app
          git fetch --no-tags --depth 1 origin "$WINLATOR_SHA"
          git checkout --detach "$WINLATOR_SHA"
          test -f app/build.gradle
          test -f app/src/main/java/com/winlator/XServerDisplayActivity.java
          grep -q 'versionName "11.2"' app/build.gradle

      - name: Lint shell scripts
        run: |
          for f in tools/*.sh; do
            bash -n "$f"
          done

      - name: Prepare Winlator runtime
        run: bash tools/prepare-winlator.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify NHH launcher is the Android launcher activity
        run: |
          APK="winlator-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.noheroshere.snap'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.snapix.nhhlauncher.MainActivity'" /tmp/badging.txt
          unzip -l "$APK" | grep -q "nhh_hero.jpg"
          unzip -l "$APK" | grep -q "nhh_poster.png"
          unzip -l "$APK" | grep -q "nhh_icon.png"
          unzip -l "$APK" | grep -q "assets/inputcontrols/profiles/controls-5.icp"
          unzip -l "$APK" | grep -q "assets/inputcontrols/profiles/controls-6.icp"
          PROFILE_COUNT=$(unzip -l "$APK" | grep -E "assets/inputcontrols/profiles/controls-[0-9]+\.icp" | wc -l)
          test "$PROFILE_COUNT" -eq 2

      - uses: actions/upload-artifact@v6
        with:
          name: nhh-launcher-debug-${{ github.run_number }}
          path: winlator-app/app/build/outputs/apk/debug/app-debug.apk
